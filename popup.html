<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 340px;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 12px;
    margin: 0;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  #dropzone {
    border: 2px dashed #999;
    border-radius: 8px;
    padding: 24px 10px;
    text-align: center;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  #dropzone.drag {
    background: #eef6ff;
    border-color: #3b82f6;
  }
  #preview {
    max-width: 100%;
    max-height: 160px;
    display: none;
    margin-top: 10px;
    border-radius: 6px;
  }
  #result {
    margin-top: 12px;
    font-size: 13px;
    word-break: break-all;
    display: none;
  }
  #result.error {
    color: #c0392b;
  }
  #linkBox {
    background: #f3f4f6;
    border-radius: 6px;
    padding: 8px;
    margin-top: 6px;
  }
  .actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 6px 8px;
    border: none;
    border-radius: 6px;
    background: #3b82f6;
    color: white;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary {
    background: #6b7280;
  }
  #fileInput {
    display: none;
  }
  #historySection {
    margin-top: 14px;
    display: none;
  }
  #historySection h2 {
    font-size: 12px;
    color: #666;
    margin: 0 0 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #historySection h2 button {
    flex: none;
    background: none;
    color: #999;
    font-size: 11px;
    padding: 2px 4px;
    text-decoration: underline;
  }
  #historyList {
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .histItem {
    background: #f3f4f6;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .histItem .thumb {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 4px;
    object-fit: cover;
    background: #fff;
  }
  .histItem .body {
    flex: 1;
    min-width: 0;
  }
  .histItem .text {
    word-break: break-all;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .histItem .time {
    color: #999;
    font-size: 10px;
    margin-top: 2px;
  }
  .histItem .actions {
    flex: none;
  }
  .histItem button {
    padding: 4px 10px;
    font-size: 11px;
    flex: none;
  }
</style>
</head>
<body>
  <h1>QR Link Scanner</h1>
  <div id="dropzone">
    Drag &amp; drop a QR screenshot here<br/>
    or <u>click to choose</u><br/>
    or just <b>Ctrl+V</b> paste
  </div>
  <input type="file" id="fileInput" accept="image/*" />
  <img id="preview" />
  <div id="result"></div>

  <div id="historySection">
    <h2>This tab's history <button id="clearHistory">clear</button></h2>
    <div id="historyList"></div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>
  <script src="jsQR.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
